<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <title>Shelf Drive Architecture Diagram</title>
  <desc>Architecture workflow diagram showing how Shelf Drive connects your device through a local-first Rust backend to Telegram Cloud for unlimited encrypted storage. Flow: Your Device (React + Tauri) connects via local-first architecture to Shelf Drive Core (Rust Backend, SQLite DB, REST API, WebDAV, Stream Engine) which communicates over MTProto encryption to Telegram Cloud (Saved Messages, Private Channels, Unlimited Storage).</desc>

  <defs>
    <!-- Canvas gradient -->
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121b2e"/>
    </linearGradient>

    <!-- Frosted glass fill for outer boxes -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d45" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#162035" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Frosted glass fill for center box -->
    <linearGradient id="glassCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3550" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#132840" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#4FC3F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Cyan glow filter for center box -->
    <filter id="cyanGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.31
                0 0 0 0 0.76
                0 0 0 0 0.97
                0 0 0 0.35 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow for all boxes -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Arrowhead marker -->
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#4FC3F7"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="1200" height="500" fill="url(#canvasBg)" rx="0"/>

  <!-- Subtle grid dots for texture -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#4FC3F7"/>
    </pattern>
    <rect width="1200" height="500" fill="url(#dots)"/>
  </g>

  <!-- ===== BOX 1: YOUR DEVICE (left) ===== -->
  <g filter="url(#boxShadow)">
    <rect x="50" y="120" width="240" height="260" rx="14" ry="14"
          fill="url(#glassFill)" stroke="#3a5070" stroke-width="1.2"/>
  </g>

  <!-- Device icon -->
  <g transform="translate(170, 160)">
    <!-- Monitor body -->
    <rect x="-28" y="-18" width="56" height="38" rx="4" ry="4"
          fill="none" stroke="#4FC3F7" stroke-width="1.8"/>
    <!-- Screen content lines -->
    <line x1="-18" y1="-8" x2="10" y2="-8" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
    <line x1="-18" y1="-1" x2="18" y2="-1" stroke="#4FC3F7" stroke-width="1" opacity="0.35"/>
    <line x1="-18" y1="6" x2="5" y2="6" stroke="#4FC3F7" stroke-width="1" opacity="0.25"/>
    <!-- Stand -->
    <line x1="0" y1="20" x2="0" y2="28" stroke="#4FC3F7" stroke-width="1.5"/>
    <line x1="-14" y1="28" x2="14" y2="28" stroke="#4FC3F7" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- "Your Device" title -->
  <text x="170" y="212" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="600" fill="#e9eef8">Your Device</text>

  <!-- Tech label -->
  <rect x="112" y="230" width="116" height="24" rx="12" ry="12"
        fill="#4FC3F7" fill-opacity="0.12" stroke="#4FC3F7" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="170" y="247" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12" font-weight="500" fill="#4FC3F7">React + Tauri</text>

  <!-- Platform list -->
  <text x="170" y="290" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#8a9bb5">Desktop</text>
  <text x="170" y="310" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#8a9bb5">Mobile</text>
  <text x="170" y="330" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#8a9bb5">TV</text>

  <!-- Separator dots between platforms -->
  <circle cx="170" cy="298" r="1" fill="#4FC3F7" opacity="0.3"/>
  <circle cx="170" cy="318" r="1" fill="#4FC3F7" opacity="0.3"/>

  <!-- ===== ARROW 1: Local-first ===== -->
  <path d="M295,250 C340,250 350,250 395,250"
        fill="none" stroke="url(#arrowGrad)" stroke-width="2"
        marker-end="url(#arrowHead)" stroke-linecap="round"/>
  <!-- Animated dash overlay -->
  <path d="M295,250 C340,250 350,250 390,250"
        fill="none" stroke="#4FC3F7" stroke-width="1.2" opacity="0.5"
        stroke-dasharray="6,8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Arrow label -->
  <rect x="310" y="222" width="76" height="20" rx="10" ry="10"
        fill="#0b1220" fill-opacity="0.85" stroke="#3a5070" stroke-width="0.6"/>
  <text x="348" y="236" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="11" font-weight="500" fill="#7eb8da">Local-first</text>

  <!-- ===== BOX 2: SHELF DRIVE CORE (center, highlighted) ===== -->
  <g filter="url(#cyanGlow)">
    <rect x="410" y="90" width="380" height="320" rx="16" ry="16"
          fill="url(#glassCenter)" stroke="#4FC3F7" stroke-width="1.8"/>
  </g>

  <!-- Inner subtle border highlight -->
  <rect x="412" y="92" width="376" height="316" rx="15" ry="15"
        fill="none" stroke="#4FC3F7" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Shield / core icon -->
  <g transform="translate(600, 132)">
    <!-- Shield shape -->
    <path d="M0,-18 L16,-10 L16,4 C16,14 0,22 0,22 C0,22 -16,14 -16,4 L-16,-10 Z"
          fill="none" stroke="#4FC3F7" stroke-width="1.8"/>
    <!-- Check mark inside shield -->
    <path d="M-6,2 L-2,7 L7,-4" fill="none" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "Shelf Drive Core" title -->
  <text x="600" y="174" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="700" fill="#e9eef8">Shelf Drive Core</text>

  <!-- Component pills -->
  <!-- Row 1 -->
  <rect x="445" y="200" width="130" height="30" rx="8" ry="8"
        fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.25" stroke-width="0.8"/>
  <text x="510" y="220" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="500" fill="#b0d4ec">Rust Backend</text>

  <rect x="590" y="200" width="130" height="30" rx="8" ry="8"
        fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.25" stroke-width="0.8"/>
  <text x="655" y="220" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="500" fill="#b0d4ec">SQLite DB</text>

  <!-- Row 2 -->
  <rect x="445" y="245" width="130" height="30" rx="8" ry="8"
        fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.25" stroke-width="0.8"/>
  <text x="510" y="265" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="500" fill="#b0d4ec">REST API</text>

  <rect x="590" y="245" width="130" height="30" rx="8" ry="8"
        fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.25" stroke-width="0.8"/>
  <text x="655" y="265" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="500" fill="#b0d4ec">WebDAV</text>

  <!-- Row 3 -->
  <rect x="480" y="290" width="200" height="30" rx="8" ry="8"
        fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.25" stroke-width="0.8"/>
  <text x="580" y="310" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="500" fill="#b0d4ec">Stream Engine</text>

  <!-- Decorative connection lines between pills -->
  <line x1="510" y1="230" x2="510" y2="245" stroke="#4FC3F7" stroke-opacity="0.12" stroke-width="0.8"/>
  <line x1="655" y1="230" x2="655" y2="245" stroke="#4FC3F7" stroke-opacity="0.12" stroke-width="0.8"/>
  <line x1="550" y1="275" x2="550" y2="290" stroke="#4FC3F7" stroke-opacity="0.12" stroke-width="0.8"/>

  <!-- Center box bottom accent line -->
  <line x1="460" y1="370" x2="740" y2="370" stroke="#4FC3F7" stroke-opacity="0.15" stroke-width="1" stroke-linecap="round"/>

  <!-- ===== ARROW 2: MTProto (encrypted) ===== -->
  <path d="M795,250 C840,250 850,250 895,250"
        fill="none" stroke="url(#arrowGrad)" stroke-width="2"
        marker-end="url(#arrowHead)" stroke-linecap="round"/>
  <!-- Animated dash overlay -->
  <path d="M795,250 C840,250 850,250 890,250"
        fill="none" stroke="#4FC3F7" stroke-width="1.2" opacity="0.5"
        stroke-dasharray="6,8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Arrow label -->
  <rect x="790" y="216" width="118" height="22" rx="11" ry="11"
        fill="#0b1220" fill-opacity="0.85" stroke="#3a5070" stroke-width="0.6"/>
  <!-- Lock icon in label -->
  <g transform="translate(808, 227)">
    <rect x="-4" y="-1" width="8" height="6" rx="1" fill="none" stroke="#7eb8da" stroke-width="0.8"/>
    <path d="M-2,-1 L-2,-3.5 C-2,-5.5 2,-5.5 2,-3.5 L2,-1" fill="none" stroke="#7eb8da" stroke-width="0.8"/>
  </g>
  <text x="856" y="231" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="10.5" font-weight="500" fill="#7eb8da">MTProto (encrypted)</text>

  <!-- ===== BOX 3: TELEGRAM CLOUD (right) ===== -->
  <g filter="url(#boxShadow)">
    <rect x="910" y="120" width="240" height="260" rx="14" ry="14"
          fill="url(#glassFill)" stroke="#3a5070" stroke-width="1.2"/>
  </g>

  <!-- Cloud icon -->
  <g transform="translate(1030, 162)">
    <path d="M-22,4 C-28,4 -32,-1 -32,-7 C-32,-13 -27,-17 -21,-17 C-20,-17 -19,-16.8 -18,-16.5
             C-15,-22 -9,-26 -2,-26 C7,-26 15,-20 16,-12 C22,-11 26,-6 26,-1 C26,5 21,9 15,9
             L-22,9 C-22,7.5 -22,5.5 -22,4 Z"
          fill="none" stroke="#4FC3F7" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- "Telegram Cloud" title -->
  <text x="1030" y="212" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="600" fill="#e9eef8">Telegram Cloud</text>

  <!-- Feature list with bullet dots -->
  <circle cx="965" cy="252" r="3" fill="#4FC3F7" fill-opacity="0.5"/>
  <text x="978" y="256" text-anchor="start"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#8a9bb5">Saved Messages</text>

  <circle cx="965" cy="280" r="3" fill="#4FC3F7" fill-opacity="0.5"/>
  <text x="978" y="284" text-anchor="start"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#8a9bb5">Private Channels</text>

  <circle cx="965" cy="308" r="3" fill="#4FC3F7" fill-opacity="0.5"/>
  <text x="978" y="312" text-anchor="start"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#8a9bb5">Unlimited Storage</text>

  <!-- Infinity symbol for unlimited -->
  <g transform="translate(1080, 308)" opacity="0.25">
    <path d="M-8,0 C-8,-5 -3,-5 0,0 C3,5 8,5 8,0 C8,-5 3,-5 0,0 C-3,5 -8,5 -8,0 Z"
          fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
  </g>

  <!-- ===== Footer branding ===== -->
  <text x="600" y="465" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="11" fill="#3a5070" letter-spacing="2">SHELF DRIVE ARCHITECTURE</text>

  <!-- Subtle top/bottom edge highlights -->
  <line x1="100" y1="1" x2="1100" y2="1" stroke="#4FC3F7" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="100" y1="499" x2="1100" y2="499" stroke="#4FC3F7" stroke-opacity="0.06" stroke-width="1"/>
</svg>