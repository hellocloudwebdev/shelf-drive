<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="sec-title sec-desc">
  <title id="sec-title">Privacy &amp; Security</title>
  <desc id="sec-desc">Section banner for Privacy and Security: Your files, your rules</desc>

  <defs>
    <linearGradient id="sec-bg" x1="0" y1="0" x2="1200" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121b2e"/>
    </linearGradient>

    <linearGradient id="sec-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0.04"/>
    </linearGradient>

    <radialGradient id="sec-glow" cx="100" cy="65" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="sec-clip">
      <rect width="1200" height="130" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sec-clip)">
    <!-- Background -->
    <rect width="1200" height="130" fill="url(#sec-bg)"/>

    <!-- Glow -->
    <ellipse cx="100" cy="65" rx="180" ry="100" fill="url(#sec-glow)"/>

    <!-- Frosted glass panel -->
    <rect x="16" y="12" width="1168" height="106" rx="10" fill="url(#sec-glass)" stroke="#4FC3F7" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Shield + lock decorative motif (left side) -->
    <g opacity="0.35" transform="translate(48, 25)">
      <!-- Shield outline -->
      <path d="M28 4 L48 12 L48 36 C48 52 38 62 28 68 C18 62 8 52 8 36 L8 12 Z" fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-width="1.3" stroke-linejoin="round"/>

      <!-- Inner shield highlight -->
      <path d="M28 12 L42 18 L42 36 C42 48 34 56 28 60 C22 56 14 48 14 36 L14 18 Z" fill="none" stroke="#4FC3F7" stroke-width="0.8" stroke-opacity="0.4" stroke-linejoin="round"/>

      <!-- Lock body on shield -->
      <rect x="22" y="32" width="12" height="10" rx="2" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="22" y="32" width="12" height="10" rx="2" fill="#4FC3F7" fill-opacity="0.15"/>

      <!-- Lock shackle -->
      <path d="M25 32 L25 27 C25 23 31 23 31 27 L31 32" fill="none" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Keyhole dot -->
      <circle cx="28" cy="37" r="1.5" fill="#4FC3F7" opacity="0.6"/>
    </g>

    <!-- Section number -->
    <text x="140" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#4FC3F7" opacity="0.30" letter-spacing="-2">03</text>

    <!-- Title -->
    <text x="220" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#e9eef8">Privacy &amp; Security</text>

    <!-- Subtitle -->
    <text x="220" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#e9eef8" opacity="0.55">Your files, your rules</text>

    <!-- Right-side decorative: scattered small locks fading out -->
    <g opacity="0.12" stroke="#4FC3F7" stroke-width="0.8" fill="none">
      <rect x="1070" y="38" width="8" height="6" rx="1"/>
      <path d="M1072 38 L1072 36 C1072 34 1076 34 1076 36 L1076 38"/>
      <rect x="1100" y="55" width="8" height="6" rx="1"/>
      <path d="M1102 55 L1102 53 C1102 51 1106 51 1106 53 L1106 55"/>
      <rect x="1130" y="72" width="8" height="6" rx="1"/>
      <path d="M1132 72 L1132 70 C1132 68 1136 68 1136 70 L1136 72"/>
    </g>

    <!-- Bottom accent bar -->
    <rect x="220" y="118" width="60" height="2" rx="1" fill="#4FC3F7" opacity="0.40"/>
  </g>
</svg>
