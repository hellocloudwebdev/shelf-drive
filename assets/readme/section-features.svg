<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="feat-title feat-desc">
  <title id="feat-title">Features</title>
  <desc id="feat-desc">Section banner for Features: Everything you need, nothing you don't</desc>

  <defs>
    <!-- Canvas gradient -->
    <linearGradient id="feat-bg" x1="0" y1="0" x2="1200" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121b2e"/>
    </linearGradient>

    <!-- Frosted glass panel -->
    <linearGradient id="feat-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="feat-glow" cx="120" cy="65" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for rounded banner -->
    <clipPath id="feat-clip">
      <rect width="1200" height="130" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#feat-clip)">
    <!-- Background -->
    <rect width="1200" height="130" fill="url(#feat-bg)"/>

    <!-- Subtle glow behind icon area -->
    <ellipse cx="100" cy="65" rx="180" ry="100" fill="url(#feat-glow)"/>

    <!-- Frosted glass panel -->
    <rect x="16" y="12" width="1168" height="106" rx="10" fill="url(#feat-glass)" stroke="#4FC3F7" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Grid / cards decorative motif (left side) -->
    <g opacity="0.35" transform="translate(44, 30)">
      <!-- 3x3 grid of small rounded rects -->
      <rect x="0"  y="0"  width="18" height="18" rx="3" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="24" y="0"  width="18" height="18" rx="3" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="48" y="0"  width="18" height="18" rx="3" fill="#4FC3F7" fill-opacity="0.25" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="0"  y="24" width="18" height="18" rx="3" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="24" y="24" width="18" height="18" rx="3" fill="#4FC3F7" fill-opacity="0.25" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="48" y="24" width="18" height="18" rx="3" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="0"  y="48" width="18" height="18" rx="3" fill="#4FC3F7" fill-opacity="0.15" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="24" y="48" width="18" height="18" rx="3" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
      <rect x="48" y="48" width="18" height="18" rx="3" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
    </g>

    <!-- Section number -->
    <text x="140" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#4FC3F7" opacity="0.30" letter-spacing="-2">01</text>

    <!-- Title -->
    <text x="220" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#e9eef8">Features</text>

    <!-- Subtitle -->
    <text x="220" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#e9eef8" opacity="0.55">Everything you need, nothing you don't</text>

    <!-- Right-side decorative accent line -->
    <line x1="1050" y1="35" x2="1150" y2="35" stroke="#4FC3F7" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1070" y1="65" x2="1150" y2="65" stroke="#4FC3F7" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>
    <line x1="1090" y1="95" x2="1150" y2="95" stroke="#4FC3F7" stroke-opacity="0.06" stroke-width="1" stroke-linecap="round"/>

    <!-- Bottom accent bar -->
    <rect x="220" y="118" width="60" height="2" rx="1" fill="#4FC3F7" opacity="0.40"/>
  </g>
</svg>
