name: Arch fixture build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-fixture:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Build the Debian bundle without updater signing
        working-directory: app
        run: |
          set -euo pipefail
          printf '{"bundle":{"createUpdaterArtifacts":false}}' > /tmp/fixture-overlay.json
          npm run tauri -- build --bundles deb --config /tmp/fixture-overlay.json

      - name: Stage the fixture under the canonical name
        run: |
          set -euo pipefail
          version="$(node -p "require('./app/package.json').version")"
          deb="$(find app/src-tauri/target/release/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "${deb}"
          cp "${deb}" "Shelf.Drive_${version}_amd64.deb"
          sha256sum "Shelf.Drive_${version}_amd64.deb" | tee fixture-sha256.txt

      - name: Publish to the ci-fixtures release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./app/package.json').version")"
          asset="Shelf.Drive_${version}_amd64.deb"
          gh release create ci-fixtures --target "$GITHUB_SHA" \
            --title 'CI packaging fixtures' \
            --notes 'Immutable packaging fixtures for the arch-package.yml contract tests. Regenerate with the Arch fixture build workflow, then pin the new SHA256, filename, and version in arch-package.yml.' || true
          gh release upload ci-fixtures "${asset}" --clobber
          echo "Pinned asset: ${asset}"
          cat fixture-sha256.txt
