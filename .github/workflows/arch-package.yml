name: Arch package

on:
  pull_request:
    paths:
      - '.github/workflows/arch-package.yml'
      - '.github/workflows/release.yml'
      - 'packaging/arch/**'
      - 'scripts/render-arch-pkgbuild.sh'
      - 'scripts/verify-arch-package.sh'
      - 'scripts/generate-arch-runtime-sbom.sh'
      - 'app/src-tauri/src/installation.rs'
      - 'app/src-tauri/src/linux_startup.rs'
      - 'app/src/hooks/useUpdateCheck.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/arch-package.yml'
      - '.github/workflows/release.yml'
      - 'packaging/arch/**'
      - 'scripts/render-arch-pkgbuild.sh'
      - 'scripts/verify-arch-package.sh'
      - 'scripts/generate-arch-runtime-sbom.sh'
      - 'app/src-tauri/src/installation.rs'
      - 'app/src-tauri/src/linux_startup.rs'
      - 'app/src/hooks/useUpdateCheck.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: archlinux:base-devel-20260823.0.578598@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install package validation tools
        run: |
          pacman -Syu --noconfirm \
            cairo \
            curl \
            dbus \
            desktop-file-utils \
            gdk-pixbuf2 \
            gtk3 \
            jq \
            libayatana-appindicator \
            libarchive \
            libsoup3 \
            namcap \
            pacman-contrib \
            webkit2gtk-4.1 \
            xorg-server-xvfb \
            xorg-xauth

      - name: Download and verify the immutable packaging fixture
        # Self-hosted fixture built by the 'Arch fixture build' workflow
        # (.github/workflows/arch-fixture.yml) and published on the ci-fixtures
        # release. After a version bump, re-run that workflow and update the
        # URL, filename, SHA256, and the version arguments below together.
        run: |
          set -euo pipefail
          mkdir -p fixture
          curl --fail --location --retry 3 \
            'https://github.com/hellocloudwebdev/shelf-drive/releases/download/ci-fixtures/Shelf.Drive_4.0.0_amd64.deb' \
            --output fixture/Shelf.Drive_4.0.0_amd64.deb
          echo 'c9d6137596cf2535f08a622453722008c97f6649154ecd90f82cb2fdac0e8f20  fixture/Shelf.Drive_4.0.0_amd64.deb' | sha256sum -c -

      - name: Build and inspect the fixture package as an unprivileged user
        run: |
          set -euo pipefail
          bash scripts/render-arch-pkgbuild.sh fixture/Shelf.Drive_4.0.0_amd64.deb 4.0.0 arch-package
          useradd --create-home --shell /bin/bash arch-builder
          chown -R arch-builder:arch-builder arch-package
          runuser -u arch-builder -- bash -c 'cd "$1" && makepkg --printsrcinfo > .SRCINFO && makepkg --cleanbuild --clean --noconfirm' _ "$PWD/arch-package"
          package_path="$(find arch-package -maxdepth 1 -type f -name 'shelf-drive-bin-*.pkg.tar.zst' -print -quit)"
          test -n "${package_path}"
          namcap arch-package/PKGBUILD "${package_path}" 2>&1 | tee arch-package/namcap.log
          if grep -Eq '(^|[[:space:]])E:' arch-package/namcap.log; then
            echo '::error::namcap reported a package error'
            exit 1
          fi
          pacman -U --noconfirm "${package_path}"
          bash scripts/verify-arch-package.sh "${package_path}" 4.0.0

      - name: Verify the native package starts and produces a runtime SBOM
        run: |
          set -euo pipefail
          set +e
          runuser -u arch-builder -- dbus-run-session -- xvfb-run -a timeout --kill-after=5s 15s shelf-drive > arch-package/startup-smoke.log 2>&1
          smoke_status=$?
          set -e
          if [[ ${smoke_status} -ne 124 && ${smoke_status} -ne 137 ]]; then
            cat arch-package/startup-smoke.log
            exit 1
          fi
          if grep -Eiq 'EGL_BAD_ALLOC|Could not create.*EGL display|segmentation fault|thread .* panicked' arch-package/startup-smoke.log; then
            cat arch-package/startup-smoke.log
            exit 1
          fi
          bash scripts/generate-arch-runtime-sbom.sh 4.0.0 arch-package/shelf-drive-arch-runtime-sbom.cdx.json
